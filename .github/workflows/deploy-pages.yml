name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the deployment publish to Pages, and read the repo to build it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs wait rather than cancelling, so the
# live site always reflects the newest push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron is a dev dependency the web build never needs, and its
      # postinstall downloads a ~100MB binary. Skip it.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        # Turns Pages on for the repo if it is not already, so the first run
        # does not fail with "Get Pages site failed".
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
