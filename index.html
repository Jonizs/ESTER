<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESTER</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304050a'/%3E%3Crect x='7' y='13' width='18' height='7' fill='%234fae78'/%3E%3Cpath d='M9 20h14l-7 8z' fill='%235a6170'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <!-- Stats for the selected agent. Hidden until one is clicked. -->
    <div id="agent-panel" hidden>
      <div class="name">Agent</div>

      <div class="activity">
        <div class="activity-line">
          <span class="activity-name">Idle</span>
          <span class="activity-time"></span>
        </div>
        <div class="bar"><span class="fill"></span></div>
      </div>

      <div class="meters">
        <div class="meter" data-stat="health"><label>Health</label><div class="bar"><span class="fill"></span></div><span class="value"></span></div>
        <div class="meter" data-stat="food"><label>Food</label><div class="bar"><span class="fill"></span></div><span class="value"></span></div>
        <div class="meter" data-stat="water"><label>Water</label><div class="bar"><span class="fill"></span></div><span class="value"></span></div>
        <div class="meter" data-stat="happiness"><label>Happiness</label><div class="bar"><span class="fill"></span></div><span class="value"></span></div>
      </div>

      <div class="traits">
        <div><label>Education</label><span data-trait="education"></span></div>
        <div><label>Tool</label><span data-trait="tool"></span></div>
        <div><label>Mastery</label><span data-trait="mastery"></span></div>
      </div>
    </div>

    <!-- The current job, floating over the agent's head. -->
    <div id="action">
      <span class="text"></span>
      <div class="bar"><span class="fill"></span></div>
    </div>

    <div id="help">
      <div><b>Drag</b> &mdash; orbit</div>
      <div><b>Wheel</b> / <b data-help="zoomIn"></b> <b data-help="zoomOut"></b> &mdash; zoom</div>
      <div><b>Esc</b> &mdash; menu</div>
      <div><b data-help="resetView"></b> &mdash; reset view</div>
      <div><b data-help="autoSpin"></b> &mdash; toggle auto-spin</div>
      <div><b>Click the agent</b> &mdash; select it</div>
      <div><b>Right click</b> &mdash; deselect</div>
      <div><b>Click</b> &mdash; send it there, or set it on a tree or rock</div>
    </div>

    <div id="menu" hidden>
      <div class="panel">
        <section data-page="main">
          <h2>Paused</h2>

          <label class="setting" for="camera-speed">
            <span>Camera speed</span>
            <input id="camera-speed" type="range" />
            <span id="camera-speed-value" class="value"></span>
          </label>

          <div class="buttons">
            <button type="button" id="menu-keybinds">KEYBINDS</button>
            <button type="button" id="menu-defaults">RESET TO DEFAULTS</button>
            <button type="button" id="menu-resume">RESUME</button>
            <button type="button" id="menu-leave" class="danger">LEAVE GAME</button>
          </div>
        </section>

        <section data-page="keybinds" hidden>
          <h2>Keybinds</h2>
          <p class="hint">Click a key to rebind it. Esc goes back.</p>
          <div id="keybind-list"></div>
          <div class="keybind fixed"><span>Menu</span><span class="key">Esc</span></div>
          <div class="buttons">
            <button type="button" id="menu-back">BACK</button>
          </div>
        </section>
      </div>
    </div>

    <div id="loading">booting ESTER&hellip;</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
